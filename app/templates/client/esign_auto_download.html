<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing Complete | ZoiKYC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #090d16 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #f8fafc;
        }
        .card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 44px 36px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6), 0 0 40px -10px rgba(99, 102, 241, 0.2);
            animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(16px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 24px;
        }
        .icon-wrap {
            width: 80px;
            height: 80px;
            margin: 0 auto 22px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 30px -6px rgba(16, 185, 129, 0.5);
            animation: pulseSuccess 2s infinite;
        }
        @keyframes pulseSuccess {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
            70% { box-shadow: 0 0 0 16px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .icon-wrap svg {
            width: 40px;
            height: 40px;
            stroke: #ffffff;
            stroke-width: 3.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        h1 {
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
            color: #ffffff;
        }
        p.subtitle {
            font-size: 0.94rem;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 26px;
        }
        .download-pill {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            padding: 12px 18px;
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
            width: 100%;
            justify-content: center;
        }
        .progress-bar-wrap {
            height: 5px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6366f1 0%, #10b981 100%);
            animation: progressAnim 1.6s ease-in-out forwards;
        }
        @keyframes progressAnim {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .redirect-status {
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 500;
            margin-bottom: 22px;
        }
        .actions-wrap {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.82rem;
            color: #64748b;
        }
        .actions-wrap a {
            color: #818cf8;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        .actions-wrap a:hover {
            color: #a5b4fc;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand-badge">
            <svg width="12" height="12" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
            ZoiKYC Verified E-Sign
        </div>

        <div class="icon-wrap">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>

        <h1>Signing Complete!</h1>
        <p class="subtitle">Your document has been securely verified and digitally signed with Aadhaar e-Sign.</p>

        <div class="download-pill">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Downloading signed PDF automatically...
        </div>

        <div class="progress-bar-wrap">
            <div class="progress-bar"></div>
        </div>

        <div class="redirect-status">
            Returning to partner website in a moment...
        </div>

        <div class="actions-wrap">
            <div>Didn't start? <a href="{{ download_url }}" id="manualDownloadBtn" download>Click here to download PDF</a></div>
            <div>Not redirected? <a href="{{ redirect_url }}" id="manualRedirectBtn">Click here to continue</a></div>
        </div>
    </div>

    <!-- Hidden iframe to trigger file download automatically -->
    <iframe src="{{ download_url }}" style="display:none;" id="downloadFrame"></iframe>

    <script>
        // Trigger automatic download via dynamic anchor
        try {
            var dlAnchor = document.createElement('a');
            dlAnchor.href = "{{ download_url }}";
            dlAnchor.setAttribute('download', "Signed_{{ filename }}");
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            document.body.removeChild(dlAnchor);
        } catch (e) {
            console.error("Auto download trigger error:", e);
        }

        // Automatically redirect to the partner callback URL after 1.6 seconds
        setTimeout(function() {
            window.location.href = "{{ redirect_url }}";
        }, 1600);
    </script>
</body>
</html>
