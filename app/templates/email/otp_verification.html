<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verification Code — ZoiKYC</title>
</head>

<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; margin: 0; padding: 36px 16px; color: #0f172a;">

  <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0"
    style="max-width: 500px; margin: 0 auto; background-color: #ffffff; border-radius: 20px; border: 1px solid #e2e8f0; box-shadow: 0 12px 36px rgba(15, 23, 42, 0.08); overflow: hidden;">

    <!-- Brand Header with zoikyc_logo.png in Middle -->
    <tr>
      <td align="center" style="padding: 24px 20px; background: linear-gradient(135deg, #3b0764 0%, #581c87 50%, #7e22ce 100%); text-align: center;">
        <div style="display: inline-block; background: #ffffff; padding: 8px 24px; border-radius: 30px; box-shadow: 0 4px 16px rgba(0,0,0,0.2);">
          <img src="https://raw.githubusercontent.com/vijayvaishnav1011/zoikyc/main/app/static/images/zoikyc_logo.png" alt="ZoiKYC" width="130" style="display: block; height: auto; max-height: 34px;">
        </div>
      </td>
    </tr>

    <!-- Body Section (Clean & Minimal) -->
    <tr>
      <td style="padding: 30px 28px;">
        <h1 style="font-size: 20px; font-weight: 800; color: #0f172a; margin: 0 0 6px 0; letter-spacing: -0.3px;">
          Email Verification Code
        </h1>
        
        <p style="font-size: 14px; font-weight: 700; color: #7e22ce; margin: 0 0 20px 0;">
          Use this code to verify your account
        </p>

        <!-- 6-Digit OTP Box in Lavender Accent Card -->
        <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="margin-bottom: 22px;">
          <tr>
            <td align="center" style="background: #faf5ff; border: 1.5px solid #e9d5ff; border-radius: 14px; padding: 22px;">
              <div style="font-size: 11px; font-weight: 700; color: #7e22ce; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px;">
                Your One-Time Password
              </div>
              <div style="font-size: 36px; font-weight: 800; letter-spacing: 12px; color: #3b0764; font-family: monospace; text-indent: 12px;">
                {{ otp_code }}
              </div>
              <div style="font-size: 12px; color: #64748b; margin-top: 8px; font-weight: 600;">
                Valid for 15 minutes &bull; Do not share with anyone
              </div>
            </td>
          </tr>
        </table>

        <p style="font-size: 12px; color: #94a3b8; line-height: 1.5; margin: 0; text-align: center;">
          If you did not request this verification code, please ignore this email or contact support at
          <a href="mailto:info@zoikyc.com" style="color: #2563eb; text-decoration: none; font-weight: 600;">info@zoikyc.com</a>.
        </p>
      </td>
    </tr>

    <!-- Footer -->
    <tr>
      <td style="background-color: #f8fafc; padding: 16px 24px; text-align: center; border-top: 1px solid #e2e8f0; font-size: 12px; color: #64748b; font-weight: 600;">
        &copy; 2026 ZoiKYC. All Rights Reserved.
      </td>
    </tr>

  </table>

</body>

</html>
