<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZoiKYC Verification Code</title>
</head>

<body
  style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; margin: 0; padding: 40px 16px; color: #0f172a;">

  <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0"
    style="max-width: 520px; margin: 0 auto; background-color: #ffffff; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 10px 30px rgba(0,0,0,0.04); overflow: hidden;">

    <!-- Top Header -->
    <tr>
      <td style="padding: 28px 32px 16px 32px; border-bottom: 1px solid #f1f5f9;">
        <table role="presentation" border="0" cellspacing="0" cellpadding="0">
          <tr>
            <td
              style="width: 38px; height: 38px; background: #2563eb; border-radius: 10px; text-align: center; vertical-align: middle; color: #ffffff; font-weight: 800; font-size: 18px;">
              Z
            </td>
            <td style="padding-left: 12px; vertical-align: middle;">
              <div style="font-size: 20px; font-weight: 800; color: #0f172a; letter-spacing: -0.5px;">ZoiKYC</div>
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- Body Section -->
    <tr>
      <td style="padding: 32px;">
        <h1 style="font-size: 20px; font-weight: 800; color: #0f172a; margin: 0 0 12px 0;">
          Email Verification Code
        </h1>

        <p style="font-size: 15px; color: #475569; line-height: 1.5; margin: 0 0 24px 0;">
          Hello <strong>{{ user_name }}</strong>,<br>
          We received a request to verify your business email address for your ZoiKYC organisation account. Please enter
          the 6-digit security code below:
        </p>

        <!-- 6-Digit OTP Box -->
        <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="margin-bottom: 24px;">
          <tr>
            <td align="center">
              <div
                style="background-color: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 12px; padding: 18px 32px; display: inline-block;">
                <div
                  style="font-size: 34px; font-weight: 800; letter-spacing: 10px; color: #2563eb; font-family: monospace; text-indent: 10px;">
                  {{ otp_code }}
                </div>
              </div>
            </td>
          </tr>
        </table>

        <p style="font-size: 13px; color: #64748b; margin: 0; text-align: center;">
          This code is valid for 15 minutes.
        </p>
      </td>
    </tr>

    <!-- Footer -->
    <tr>
      <td
        style="background-color: #f8fafc; padding: 16px 32px; text-align: center; border-top: 1px solid #f1f5f9; font-size: 12px; color: #64748b; font-weight: 600;">
        &copy; 2026 ZoiKYC. All rights reserved.
      </td>
    </tr>

  </table>

</body>

</html>
