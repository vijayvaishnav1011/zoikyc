version: '3.8'

services:
  # PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: zoikyc_db
    restart: always
    environment:
      POSTGRES_DB: zoikyc
      POSTGRES_USER: zoikyc_user
      POSTGRES_PASSWORD: Admin@32132321
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoikyc_user -d zoikyc"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ZoiKYC Flask Web Application Service
  web:
    build: .
    container_name: zoikyc_app
    restart: always
    ports:
      - "5001:5001"
    environment:
      FLASK_ENV: production
      PORT: 5001
      SECRET_KEY: ${SECRET_KEY:-zoikyc-super-secret-production-key-2026!}
      DATABASE_URL: postgresql+psycopg://zoikyc_user:Admin%4032132321@db:5432/zoikyc
      MAIL_SERVER: ${MAIL_SERVER:-smtpout.secureserver.net}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USE_SSL: ${MAIL_USE_SSL:-True}
      MAIL_USERNAME: ${MAIL_USERNAME:-info@zoibit.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-Admin@12312123}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-info@zoibit.com}
    volumes:
      - ./app/uploads:/app/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
